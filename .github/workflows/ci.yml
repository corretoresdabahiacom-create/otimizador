name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Testes automáticos
        run: dotnet run --project tests/Otimizador.Tests -c Release
      - name: Compilar o app (sem avisos)
        run: dotnet build src/Otimizador/Otimizador.csproj -c Release -warnaserror
